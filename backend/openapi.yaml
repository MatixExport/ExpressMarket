openapi: 3.0.3
info:
  title: ExpressMarket API
  description: The API for the ExpressMarket online store application.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # --- Model Schemas ---
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        login:
          type: string
          example: client
        email:
          type: string
          format: email
          example: user@example.com
        phone:
          type: string
          pattern: "^[0-9]{9}$"
          example: "123456789"
        role:
          type: string
          enum: [client, employee]
          example: client
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Fresh Water Bottle"
        description:
          type: string
          example: "A refreshing bottle of natural spring water."
        price:
          type: number
          format: decimal
          example: 1.99
        weight:
          type: number
          format: decimal
          example: 0.5
        CategoryId:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Category:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Beverages"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Order:
      type: object
      properties:
        id:
          type: integer
          example: 1
        confirmDate:
          type: string
          format: date-time
          nullable: true
        UserId:
          type: integer
          example: 1
        OrderStatusId:
          type: integer
          example: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        Products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        OrderReview:
          $ref: '#/components/schemas/OrderReview'
        OrderStatus:
          $ref: '#/components/schemas/OrderStatus'

    OrderReview:
      type: object
      properties:
        id:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        review:
          type: string
          nullable: true
        OrderId:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderStatus:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "UNAPPROVED"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # --- Request/Response Body Schemas ---
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 20
        password:
          type: string
          minLength: 8
          maxLength: 50
    
    LoginResponse:
      type: object
      properties:
        access:
          type: string
          description: JWT access token
        refresh:
          type: string
          description: JWT refresh token

    RefreshTokenRequest:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string
          description: The refresh token.
    
    RefreshTokenResponse:
      type: object
      properties:
        access:
          type: string
          description: A new JWT access token.

    RegisterRequest:
      type: object
      required: [login, password, email, phone]
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 20
        password:
          type: string
          minLength: 8
          maxLength: 50
        email:
          type: string
          format: email
          minLength: 4
          maxLength: 20
        phone:
          type: string
          pattern: "^[0-9]{9}$"

    NewProduct:
      type: object
      required: [name, description, price, weight, CategoryId]
      properties:
        name:
          type: string
          minLength: 4
          maxLength: 40
        description:
          type: string
          minLength: 8
          maxLength: 500
        price:
          type: number
          minimum: 0
        weight:
          type: number
          minimum: 0.1
          maximum: 5000
        CategoryId:
          type: integer
          minimum: 1
          maximum: 5

    BulkAddProductsRequest:
      type: object
      required: [Products]
      properties:
        Products:
          type: array
          items:
            $ref: '#/components/schemas/NewProduct'

    NewOrderRequest:
      type: object
      required: [Products]
      properties:
        Products:
          type: array
          items:
            type: object
            required: [ProductId, quantity]
            properties:
              ProductId:
                type: integer
                minimum: 1
              quantity:
                type: integer
                minimum: 1
    
    UpdateOrderRequest:
      type: object
      properties:
        OrderStatusId:
          type: integer
          minimum: 1
          maximum: 4
        confirmDate:
          type: string
          format: date

    NewOrderReviewRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        review:
          type: string
          nullable: true

    UpdateUserRequest:
      type: object
      properties:
        login:
          type: string
          minLength: 3
          maxLength: 20
        password:
          type: string
          minLength: 8
          maxLength: 50
        email:
          type: string
          format: email
          minLength: 4
          maxLength: 20
        phone:
          type: string
          pattern: "^[0-9]{9}$"
        role:
          type: string
          enum: [client, employee]

    ErrorResponse:
      type: object
      properties:
        instance:
          type: string
          description: The path where the error occurred.
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: array
              items:
                type: object
                properties:
                  message:
                    type: string
                  field:
                    type: string
        metadata:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      summary: Log in a user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /auth/refresh:
    post:
      summary: Refresh an access token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RefreshTokenResponse'
        '400':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register:
    post:
      summary: Register a new user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid request body or user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /init:
    post:
      summary: Bulk add products (employee only)
      tags: [Initialization]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAddProductsRequest'
      responses:
        '200':
          description: Products inserted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
        '403':
          description: Forbidden
        '409':
          description: Conflict, product table is not empty

  /users/whoami:
    get:
      summary: Get current user details
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized

  /users/{userId}:
    put:
      summary: Update a user's details
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '403':
          description: Forbidden
        '404':
          description: User not found

  /products:
    get:
      summary: Get all products
      tags: [Products]
      responses:
        '200':
          description: A list of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
    post:
      summary: Create a new product (employee only)
      tags: [Products]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProduct'
      responses:
        '200':
          description: Product created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '403':
          description: Forbidden

  /products/{productId}:
    get:
      summary: Get a product by ID
      tags: [Products]
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
    put:
      summary: Update a product by ID (employee only)
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProduct'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '403':
          description: Forbidden
        '404':
          description: Product not found

  /products/{productId}/seo-description:
    get:
      summary: Get SEO description for a product
      tags: [Products]
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: SEO description
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
        '404':
          description: Product not found
        '503':
          description: Service unavailable (Groq)

  /orders:
    get:
      summary: Get all orders (employee only)
      tags: [Orders]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of all orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '403':
          description: Forbidden
    post:
      summary: Create a new order
      tags: [Orders]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrderRequest'
      responses:
        '200':
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized
        '404':
          description: Product in order not found

  /orders/user:
    get:
      summary: Get orders for the current user
      tags: [Orders]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of the user's orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized

  /orders/{orderId}/review:
    post:
      summary: Add a review to an order
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrderReviewRequest'
      responses:
        '201':
          description: Review created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OrderReview'
        '403':
          description: Forbidden (not owner of order)
        '409':
          description: Conflict (review already exists or order not completed/canceled)

  /orders/{orderId}/confirm:
    post:
      summary: Confirm a received order
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order confirmed
        '403':
          description: Forbidden (not owner of order)
        '409':
          description: Conflict (order not in 'APPROVED' state)

  /orders/{orderId}/cancel:
    post:
      summary: Cancel an order
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order canceled
        '403':
          description: Forbidden (not owner of order)
        '409':
          description: Conflict (order already canceled or completed)

  /orders/status/{statusId}:
    get:
      summary: Get orders by status (employee only)
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - name: statusId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A list of orders with the specified status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '403':
          description: Forbidden

  /orders/login/{login}:
    get:
      summary: Get orders by user login (employee only)
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - name: login
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A list of orders for the specified user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '403':
          description: Forbidden
        '404':
          description: User not found

  /orders/{orderId}:
    get:
      summary: Get an order by ID (employee only)
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The requested order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '403':
          description: Forbidden
        '404':
          description: Order not found
    put:
      summary: Update an order's status (employee only)
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'
      responses:
        '200':
          description: Order updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '403':
          description: Forbidden
        '404':
          description: Order not found

  /status:
    get:
      summary: Get all possible order statuses
      tags: [Orders]
      responses:
        '200':
          description: A list of order statuses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderStatus'

  /categories:
    get:
      summary: Get all product categories
      tags: [Products]
      responses:
        '200':
          description: A list of product categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
